- id: obesity_risk
  severity: medium
  risk_type: technical_difficulty
  when:
    patient: bmi_over_30
  entity_a_flags:
  - bmi_over_30
  entity_b_flags: []
  rationale: 多项系统评价支持肥胖或内脏肥胖与直肠/结直肠手术吻合口漏增加相关，但部分综述结果不一致。BMI≥30 kg/m²是通用肥胖定义和项目触发值，内脏脂肪可能比BMI更接近技术难度。
  recommendation: 评估盆腔暴露、内脏脂肪、吻合张力和灌注，优化体重及合并症；不因BMI单项自动选择术式或造口。

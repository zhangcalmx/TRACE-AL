[project]
name = "anastomotic_leak_risks_agent"
version = "0.1.0"
description = "结直肠癌根治术吻合口漏智能风险决策系统: a rule-based decision support framework for 手术并发症-吻合口漏风险预测与决策支持 screening"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "结直肠癌根治术吻合口漏智能风险决策系统 Team" }]
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "python-dotenv>=1.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]
streamlit = [
    "streamlit>=1.60",
]
rag = [
    "lightrag-hku>=1.0,<2.0",
    "openai>=1.0",
    "tiktoken>=0.7",
    "transformers>=4.40",
]
nature = [
    # Bundled deps for the nature-* skill stack (figure / paper / citation / reader).
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "python-pptx>=0.6.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"app/streamlit_app.py" = ["BLE001", "S110"]
"src/anastomotic_leak_risks_agent/lightrag_adapter.py" = ["BLE001", "S110"]
"src/anastomotic_leak_risks_agent/llm_client.py" = ["BLE001"]
"src/anastomotic_leak_risks_agent/safety_agent.py" = ["BLE001"]

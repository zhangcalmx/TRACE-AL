    - uncertainty
    ref: Intraoperative blood pressure changes as a risk factor for anastomotic leakage in colorectal surgery.. PMID:22297862; DOI:10.1007/s00384-011-1381-7; https://pubmed.ncbi.nlm.nih.gov/22297862/
  - source_type: literature
    source_id: pmid_23014977
    claim_id: claim_r7_02
    supports:
    - trigger
    - uncertainty
    ref: 'Risk factors for anastomotic leakage following anterior resection for colorectal cancer: the effect of epidural analgesia on occurrence.. PMID:23014977; DOI:10.1007/s00384-012-1585-5; https://pubmed.ncbi.nlm.nih.gov/23014977/'
  evidence_scope:
    claim_kind: perioperative_safety_guardrail_with_indirect_al_evidence
    threshold_status: operational_needs_clinical_signoff
    boolean_logic_status: conservative_operational_trigger
    clinical_expert_signoff: false
  signal_class: safety_guardrail
- id: prolonged_surgery_risk
  severity: medium
  risk_type: operative_burden
  when:
    surgery: surgery_duration_over_4h
  entity_a_flags: []
  entity_b_flags:
  - surgery_duration_over_4h
  rationale: 系统评价将手术时间>4小时列为术中风险因素，其他队列也支持手术时间延长与吻合口漏相关；效应可能同时反映手术复杂度和患者/肿瘤因素。
  recommendation: 超过4小时后强化保温、抗菌药再给药时点、液体与灌注复核，并记录导致延长的原因；不应为追求时长阈值而牺牲肿瘤学或吻合安全。
  citations:
  - source_type: literature
    source_id: pmid_25703524
    claim_id: claim_r8_01
    supports:
    - trigger
    - threshold
    ref: Systematic review of preoperative, intraoperative and postoperative risk factors for colorectal anastomotic leaks.. PMID:25703524; DOI:10.1002/bjs.9697; https://pubmed.ncbi.nlm.nih.gov/25703524/

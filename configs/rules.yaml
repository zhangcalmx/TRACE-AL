  evidence_scope:
    claim_kind: risk_association
    threshold_status: directly_supported_in_systematic_review
    boolean_logic_status: evidence_aligned
    clinical_expert_signoff: false
  signal_class: risk_marker
- id: inflammation_nutrition_imbalance
  severity: unknown
  risk_type: immuno_nutritional_marker
  when:
    any:
    - patient: nlr_elevated_over_5
    - patient: pni_low_40
  entity_a_flags:
  - nlr_elevated_over_5
  - pni_low_40
  entity_b_flags: []
  rationale: NLR和PNI在观察性研究中与吻合口漏相关，但两者最佳阈值在研究间明显变化。NLR>5与PNI<40均是项目研究性警戒值而非跨人群通用界值，单项结果仅触发语境复核，不再直接作为已分级的吻合口漏阳性风险信号。
  recommendation: 触发后结合CRP、白蛋白、感染和营养评估解释，必要时重复检测趋势；不得把单一炎症营养指标当作诊断吻合口漏或自动造口的依据。

risk_levels:
  high: 3
  medium: 2
  low: 1
  unknown: 0
rules:
- id: low_anastomosis_risk
  severity: high
  risk_type: surgical_anatomical
  when:
    all:
    - patient: rectal_cancer
    - surgery: colorectal_anastomosis
    - surgery: anastomosis_at_or_below_5cm
  entity_a_flags:
  - rectal_cancer
  - lower_rectal_cancer
  entity_b_flags:
  - anastomosis_at_or_below_5cm
  - anastomosis_under_6cm
  - colorectal_anastomosis
  rationale: 低位直肠吻合与吻合口漏增加稳定相关。项目采用文献直接支持的距肛缘≤5 cm作为风险触发点；指南管理语境还覆盖约5–8 cm的低位吻合，阈值仍需本地校准。
  recommendation: 复核吻合口高度、灌注、张力和完整性；按指南考虑保护性造口。ICG和漏试验应结合术式与患者风险使用，不写成对所有患者均能消除漏风险。
  citations:
  - source_type: guideline
    source_id: pmid_33216491
    claim_id: claim_exp26_gl_ascrs2020_low_diversion
    supports:
    - trigger
    - management
    ref: 'The American Society of Colon and Rectal Surgeons Clinical Practice Guidelines for the Management of Rectal Cancer. https://www.ascrsu.com/ascrs/view/ASCRS-Toolkit/2851064/0/Management_of_Rectal_Cancer__2020_;
      section: Operative Treatment—Technical Aspects, recommendations 12–13; access_date: 2026-07-28'
  - source_type: literature
    source_id: pmid_25743996
    claim_id: claim_r1_03
    supports:
    - trigger
    - threshold
    ref: 'Clinical risk factors for anastomotic leakage after laparoscopic anterior resection for rectal cancer: a systematic review and meta-analysis.. PMID:25743996; DOI:10.1007/s00464-015-4117-x; https://pubmed.ncbi.nlm.nih.gov/25743996/'
  - source_type: literature
    source_id: phase2_lit_36187056
    claim_id: claim_phase2_pub_36187056
    supports:
    - trigger
    - threshold
    - uncertainty
    ref: Intracorporeal reinforcing sutures reduce anastomotic leakage in double-stapling anastomosis for laparoscopic rectal surgery.. PMID:36187056; DOI:10.5114/wiitm.2022.115168; https://pubmed.ncbi.nlm.nih.gov/36187056/
  evidence_scope:
    claim_kind: risk_association_and_management
    threshold_status: directly_supported_local_calibration_still_required
    boolean_logic_status: evidence_aligned
    clinical_expert_signoff: false
  signal_class: risk_marker
- id: malnutrition_albumin_risk
  severity: medium
  risk_type: nutritional_risk
  when:
    patient: albumin_low_35
  entity_a_flags:
  - albumin_low_35
  entity_b_flags: []
  rationale: 部分结直肠队列支持术前白蛋白<35 g/L与吻合口漏相关，但ERAS队列也报告术前白蛋白预测能力有限。白蛋白应作为营养/炎症风险提示，而不是营养不良的单一诊断或因果指标。
  recommendation: 触发后完成NRS-2002等结构化营养评估并寻找炎症、肝肾疾病等混杂因素；由营养团队制定经口/肠内优先的优化方案。不得仅为纠正化验值常规输注白蛋白。
  citations:
  - source_type: literature
    source_id: phase2_lit_31621086
    claim_id: claim_phase2_cli_31621086
    supports:
    - trigger
    - threshold
    ref: Novel nomogram with microvascular density in the surgical margins can accurately predict the risk for anastomotic leakage after anterior resection for rectal cancer.. PMID:31621086; DOI:10.1002/jso.25730;
      https://pubmed.ncbi.nlm.nih.gov/31621086/
  - source_type: literature
    source_id: phase2_lit_20404288
    claim_id: claim_phase2_cli_20404288
    supports:
    - trigger
    - threshold
    ref: 'Risk factors for anastomotic leak following colorectal surgery: a case-control study.. PMID:20404288; DOI:10.1001/archsurg.2010.40; https://pubmed.ncbi.nlm.nih.gov/20404288/'
  - source_type: literature
    source_id: pmid_37256440
    claim_id: claim_r2_01
    supports:
    - uncertainty
    ref: Is preoperative hypoalbuminemia or hypoproteinemia a reliable marker for anastomotic leakage risk in patients undergoing elective colorectal surgery in an enhanced recovery after surgery (ERAS)
      program?. PMID:37256440; DOI:10.1007/s00384-023-04450-5; https://pubmed.ncbi.nlm.nih.gov/37256440/
  evidence_scope:
    claim_kind: risk_marker_with_conflicting_evidence
    threshold_status: directly_supported_in_observational_cohorts
    boolean_logic_status: evidence_aligned
    clinical_expert_signoff: false
  signal_class: risk_marker
- id: immediate_anastomotic_defect
  severity: medium
  risk_type: intraoperative_quality
  when:
    any:
    - surgery: air_leak_test_repaired
    - surgery: air_leak_test_persistent
    - surgery: doughnut_incomplete
    - surgery: anastomotic_defect
  entity_a_flags: []
  entity_b_flags:
  - air_leak_test_repaired
  - air_leak_test_persistent
  - doughnut_incomplete
  - anastomotic_defect
  rationale: 漏试验持续阳性、吻合圈不完整或可见缺损属于未解决的即时机械完整性异常。漏试验阳性但处理后复测转阴仍保留复核提示，但不再与持续异常同级；现有系统评价未证明常规漏试验本身必然降低总体漏率。
  recommendation: 术中立即查明原因，按缺损情况缝合修补、重做吻合和/或近端转流，并在处理后重新验证完整性；完整记录缺损、处理和复测结果。
  citations:
  - source_type: guideline
    source_id: pmid_33216491
    claim_id: claim_exp26_gl_ascrs2020_integrity
    supports:
    - trigger
    - management
    ref: 'The American Society of Colon and Rectal Surgeons Clinical Practice Guidelines for the Management of Rectal Cancer. https://www.ascrsu.com/ascrs/view/ASCRS-Toolkit/2851064/0/Management_of_Rectal_Cancer__2020_;
      section: Operative Treatment—Technical Aspects, recommendations 12–13; access_date: 2026-07-28'
  - source_type: literature
    source_id: pmid_27294661
    claim_id: claim_r3_01
    supports:
    - trigger
    - uncertainty
    ref: Is the intraoperative air leak test effective in the prevention of colorectal anastomotic leakage? A systematic review and meta-analysis.. PMID:27294661; DOI:10.1007/s00384-016-2616-4; https://pubmed.ncbi.nlm.nih.gov/27294661/
  - source_type: authority_book
    source_id: booksrc_book_ascrs2_intraoperative_integrity
    claim_id: claim_book_ascrs2_intraoperative_integrity
    supports:
    - trigger
    - management
    ref: 'The ASCRS Textbook of Colon and Rectal Surgery — Postoperative Complications > Anastomotic Complications. ISBN:978-1-4419-1581-8; https://link.springer.com/book/10.1007/978-1-4419-1584-9; chapter/locator:
      ISBN:978-1-4419-1581-8; 2 ed.; chapter:Postoperative Complications > Anastomotic Complications; pages:158; Table 10-1, Steps to minimize risk of leak from colorectal or coloanal anastomoses; access_date:
      2026-07-28'
  evidence_scope:
    claim_kind: intraoperative_safety_guardrail
    threshold_status: not_applicable
    boolean_logic_status: corrected_vs_persistent_closed_loop_v1_1
    clinical_expert_signoff: false
  signal_class: safety_guardrail
  severity_overrides:
  - severity: high
    when:
      any:
      - surgery: air_leak_test_persistent
      - surgery: doughnut_incomplete
      - surgery: anastomotic_defect
- id: diabetes_poor_control_risk
  severity: medium
  risk_type: glycemic_risk
  when:
    patient: diabetes
  entity_a_flags:
  - diabetes
  - diabetes_poor_control
  entity_b_flags: []
  rationale: 荟萃证据支持糖尿病与胃肠/结直肠吻合口漏增加相关。围术期高血糖是额外的动态安全变量，但当前证据不足以把HbA1c>7%作为结直肠吻合口漏的已验证独立分界值。
  recommendation: 识别糖尿病后复核HbA1c和围术期血糖计划，并按本院糖尿病/麻醉路径个体化控制；不要因单一HbA1c阈值自动推导造口决策。
  citations:
  - source_type: literature
    source_id: pmid_25890436
    claim_id: claim_r4_01
    supports:
    - trigger
    ref: Diabetes and risk of anastomotic leakage after gastrointestinal surgery.. PMID:25890436; DOI:10.1016/j.jss.2015.03.017; https://pubmed.ncbi.nlm.nih.gov/25890436/
  - source_type: literature
    source_id: pmid_33386511
    claim_id: claim_r4_05
    supports:
    - trigger
    ref: The influence of diabetes on postoperative complications following colorectal surgery.. PMID:33386511; DOI:10.1007/s10151-020-02373-9; https://pubmed.ncbi.nlm.nih.gov/33386511/
  - source_type: literature
    source_id: pmid_33712988
    claim_id: claim_r4_03
    supports:
    - management
    - uncertainty
    ref: Association Between Intraoperative Blood Glucose and Anastomotic Leakage in Colorectal Surgery.. PMID:33712988; DOI:10.1007/s11605-021-04933-2; https://pubmed.ncbi.nlm.nih.gov/33712988/
  evidence_scope:
    claim_kind: risk_association_plus_indirect_management
    threshold_status: hba1c_cutoff_not_used_as_rule_trigger
    boolean_logic_status: evidence_aligned
    clinical_expert_signoff: false
  signal_class: risk_marker
- id: poor_performance_status_risk
  severity: medium
  risk_type: general_condition
  when:
    patient: asa_ge_III
  entity_a_flags:
  - asa_ge_III
  entity_b_flags: []
  rationale: ASA≥III在大型队列、随机试验荟萃回归和既有评分系统中反复与吻合口漏相关。ECOG仍可用于描述功能状态，但ASA属于非特异全身风险代理，不能单项决定总体高优先级。
  recommendation: 对ASA≥III患者完成心肺肾及衰弱/功能状态优化，加强术后监测；造口或术式选择仍需综合吻合高度、灌注和急诊状态。
  citations:
  - source_type: literature
    source_id: phase2_lit_35915378
    claim_id: claim_phase2_cli_35915378
    supports:
    - trigger
    - threshold
    ref: When Is a Diverting Stoma Indicated after Low Anterior Resection? A Meta-analysis of Randomized Trials and Meta-Regression of the Risk Factors of Leakage and Complications in Non-Diverted Patients..
      PMID:35915378; DOI:10.1007/s11605-022-05427-5; https://pubmed.ncbi.nlm.nih.gov/35915378/
  - source_type: literature
    source_id: pmid_27474844
    claim_id: claim_r5_02
    supports:
    - trigger
    - threshold
    ref: 'Risk factors for anastomotic leakage after colorectal resection: a retrospective analysis of 17 518 patients.. PMID:27474844; DOI:10.1111/codi.13476; https://pubmed.ncbi.nlm.nih.gov/27474844/'
  - source_type: literature
    source_id: pmid_38418633
    claim_id: claim_r5_04
    supports:
    - trigger
    - uncertainty
    ref: 'Score prediction of anastomotic leak in colorectal surgery: a systematic review.. PMID:38418633; DOI:10.1007/s00464-024-10705-1; https://pubmed.ncbi.nlm.nih.gov/38418633/'
  evidence_scope:
    claim_kind: risk_association
    threshold_status: directly_supported
    boolean_logic_status: single_factor_review_not_independent_high_v1_1
    clinical_expert_signoff: false
  signal_class: risk_marker
- id: major_blood_loss_risk
  severity: medium
  risk_type: perfusion_risk
  when:
    any:
    - surgery: blood_loss_over_500ml
    - surgery: blood_transfusion_intraop
  entity_a_flags: []
  entity_b_flags:
  - blood_loss_over_500ml
  - blood_transfusion_intraop
  rationale: 系统评价支持较多术中失血和围术期输血分别与吻合口漏或不良结局增加相关，因此不再要求二者同时存在。500 mL是项目保守警戒点，文献阈值异质且混杂明显，不能单项决定总体高优先级，也不能视为通用校准阈值。
  recommendation: 优先止血、纠正灌注不足并按患者状态采用限制性和个体化输血策略；记录失血、最低血红蛋白、输血时点与单位数，避免把输血关联误写为单独因果。
  citations:
  - source_type: literature
    source_id: phase2_lit_31665375
    claim_id: claim_phase2_cli_31665375
    supports:
    - trigger
    ref: 'Surgical-related risk factors associated with anastomotic leakage after resection for rectal cancer: a meta-analysis.. PMID:31665375; DOI:10.1093/jjco/hyz139; https://pubmed.ncbi.nlm.nih.gov/31665375/'
  - source_type: literature
    source_id: pmid_27756644
    claim_id: claim_r6_02
    supports:
    - trigger
    - uncertainty
    ref: 'Intraoperative modifiable risk factors of colorectal anastomotic leakage: Why surgeons and anesthesiologists should act together.. PMID:27756644; DOI:10.1016/j.ijsu.2016.09.098; https://pubmed.ncbi.nlm.nih.gov/27756644/'
  - source_type: literature
    source_id: pmid_36138307
    claim_id: claim_r6_05
    supports:
    - trigger
    - uncertainty
    ref: 'Operative blood loss adversely affects short and long-term outcomes after colorectal cancer surgery: results of a systematic review and meta-analysis.. PMID:36138307; DOI:10.1007/s10151-022-02701-1;
      https://pubmed.ncbi.nlm.nih.gov/36138307/'
  evidence_scope:
    claim_kind: risk_association
    threshold_status: direction_supported_project_cutoff_needs_expert_signoff
    boolean_logic_status: single_factor_review_not_independent_high_v1_1
    clinical_expert_signoff: false
  signal_class: risk_marker
- id: intraoperative_hypoperfusion_risk
  severity: medium
  risk_type: splanchnic_perfusion_safety
  when:
    surgery: hypotension_over_30min
  entity_a_flags: []
  entity_b_flags:
  - hypotension_over_30min
  - map_below_65
  rationale: 指南建议避免MAP<65 mmHg，但该建议针对总体围术期不良结局。结直肠研究中低血压与吻合口漏多为单因素关联，尚不足以证明MAP<65持续>30分钟是经外部验证的吻合口漏专属阈值。
  recommendation: 按麻醉安全路径及时纠正持续低血压并复核容量、血红蛋白和组织灌注；本规则是安全警戒，不能单独决定造口或宣称吻合口漏概率。
  citations:
  - source_type: guideline
    source_id: guideline_ascrs_sages_eras_2023
    claim_id: claim_exp26_gl_eras2023_map65
    supports:
    - threshold
    - management
    - uncertainty
    ref: 'Clinical Practice Guidelines for Enhanced Recovery After Colon and Rectal Surgery From ASCRS and SAGES. https://www.sages.org/wp-content/uploads/2017/07/Irani2023_ERAS_DisColonRect.pdf; section:
      Recommendation 5, journal p.19 (PDF p.5); recommendation 15, journal p.22 (PDF p.8); access_date: 2026-07-28'
  - source_type: literature
    source_id: pmid_22297862
    claim_id: claim_r7_01
    supports:
